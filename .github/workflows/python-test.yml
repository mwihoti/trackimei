name: Test TAC Lookup Script

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run decode smoke test
        run: |
          echo "Running decode smoke test..."
          python -m vaulttrace_imei 359103740000004 --json
          python -m vaulttrace_imei 35693803 --json
